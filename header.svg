<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 250" width="100%" height="250">
  <defs>
    <!-- Dark Tech Radial Glow Background -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#0369A1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Sleek Neon Border Gradient -->
    <linearGradient id="coolBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.85" />
    </linearGradient>

    <!-- Laser Light Shimmer Animation across Name -->
    <linearGradient id="laserShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#A5F3FC;#FFFFFF" dur="2.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="65%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#67E8F9" />
      <animate attributeName="x1" values="-100%;100%;-100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%;0%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Electric Cyan Text Glow Filter -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern for Cyber Tech Look -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <style>
    @keyframes subtleBreath {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }
    .container {
      fill: #080C14;
      stroke: url(#coolBorder);
      stroke-width: 2;
      rx: 18px;
    }
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Montserrat, sans-serif;
      font-weight: 900;
      font-size: 64px;
      letter-spacing: 9px;
      fill: url(#laserShimmer);
      text-anchor: middle;
      transform-origin: 475px 105px;
      animation: subtleBreath 4s ease-in-out infinite;
      filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.55));
    }
    .badge-card {
      fill: #0F172A;
      stroke: #1E293B;
      stroke-width: 1.5;
      rx: 10px;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 2px;
      fill: #E2E8F0;
      text-anchor: middle;
    }
    .corner-bracket {
      stroke: #38BDF8;
      stroke-width: 2.5;
      fill: none;
    }
  </style>

  <!-- Main Card Container -->
  <rect x="8" y="8" width="934" height="234" class="container" />

  <!-- Background Tech Grid -->
  <rect x="8" y="8" width="934" height="234" fill="url(#techGrid)" rx="18" />

  <!-- Radial Blue Center Light -->
  <rect x="8" y="8" width="934" height="234" fill="url(#centerGlow)" rx="18" />

  <!-- Sci-Fi Corner Brackets -->
  <path d="M 28 45 L 28 28 L 45 28" class="corner-bracket" />
  <path d="M 922 45 L 922 28 L 905 28" class="corner-bracket" />
  <path d="M 28 205 L 28 222 L 45 222" class="corner-bracket" />
  <path d="M 922 205 L 922 222 L 905 222" class="corner-bracket" />

  <!-- Status Light Bar Top Center -->
  <rect x="425" y="16" width="100" height="3" rx="1.5" fill="#38BDF8" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </rect>

  <!-- Big Laser-Shimmer Name -->
  <text x="475" y="112" class="name-title">R HARI PRIYA</text>

  <!-- Badges Row -->
  <g transform="translate(0, 142)">
    <!-- Badge 1: USN -->
    <g transform="translate(205, 12)">
      <rect x="0" y="0" width="245" height="44" class="badge-card" />
      <circle cx="26" cy="22" r="5" fill="#38BDF8">
        <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="140" y="28" class="badge-label">USN : 25BTRCA046</text>
    </g>

    <!-- Badge 2: BRANCH -->
    <g transform="translate(500, 12)">
      <rect x="0" y="0" width="245" height="44" class="badge-card" />
      <circle cx="26" cy="22" r="5" fill="#00F2FE">
        <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="140" y="28" class="badge-label">BRANCH : CSE AI</text>
    </g>
  </g>
</svg>
